<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TS — 로그인</title>

  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />

  <style>
    :root{
      --bg:#f5f6fa;
      --card:#ffffff;
      --line:#e5e7eb;
      --text:#111827;
      --muted:#6b7280;
      --shadow:0 20px 60px rgba(15,23,42,.10);
      --radius:18px;

      --brand:#182459;
      --brand2:#0E1638;

      /* ✅ 로고만 단색 고급 남색 */
      --logoSolid:#0B1F4A;

      --naver:#03C75A;
      --kakao:#FEE500;
      --google:#EA4335;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: "Pretendard", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans KR", Arial, sans-serif;
      background: radial-gradient(1100px 500px at 50% -10%, rgba(24,36,89,.10), transparent 60%), var(--bg);
      color:var(--text);
    }
    .wrap{ min-height:100vh; display:grid; place-items:center; padding:24px 14px; }
    .shell{
  width: min(1280px, 95vw);   /* ⭐ 화면 크게 사용 */
  display:grid;
  grid-template-columns: 1fr 1.2fr;
  gap:24px;                   /* 간격 조금 넓게 */
  align-items:stretch;
}
    @media (max-width: 900px){ .shell{ grid-template-columns: 1fr; } }

    .leftCard, .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }

    /* LEFT */
    .leftCard{
      padding:20px;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height: 420px;
      position:relative;
      overflow:hidden;
    }
    .leftCard::before{
      content:"";
      position:absolute; inset:-40% -25%;
      background:
        radial-gradient(closest-side, rgba(24,36,89,.18), transparent 72%),
        radial-gradient(closest-side, rgba(14,22,56,.12), transparent 72%);
      transform: rotate(16deg);
    }
    .leftInner{
      width:100%;
      max-width:320px;
      text-align:center;
      position:relative;
      z-index:1;
    }
    .appBadge{
      width: 240px;
      height: 300px;
      margin:0 auto;
      border-radius: 28px;
      border:1px solid var(--line);
      background: linear-gradient(180deg, #fff, #f7f7fb);
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
    }
    .appBadge::after{
      content:"";
      position:absolute; inset:-45% -35%;
      background: radial-gradient(closest-side, rgba(24,36,89,.18), transparent 70%);
      transform: rotate(18deg);
    }
    .badgeContent{ position:relative; z-index:1; display:grid; gap:10px; place-items:center; }

    /* ✅ 로고만 단색 남색 */
    .logo{
  width:64px;
  height:64px;
  border-radius:18px;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:transparent;
  border:none;
  padding:0;
  box-shadow:none;
}
.logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

    .leftTitle{ margin:14px 0 0; font-weight:1000; letter-spacing:-.4px; }
    .leftSub{ margin:6px 0 0; color:var(--muted); font-size: 13px; line-height:1.45; }

    /* RIGHT */
    .card{ padding:20px; }
    .title{ font-size: 20px; font-weight: 1000; letter-spacing: -.4px; margin:0 0 16px; }
    .small{ color:var(--muted); font-size:12px; margin:0; }

    label{
      display:block;
      font-size: 12px;
      color: var(--muted);
      font-weight: 900;
      margin: 10px 0 8px;
    }
    input{
      width:100%;
      height: 46px;
      border-radius: 14px;
      border:1px solid var(--line);
      padding: 0 14px;
      font-size: 14px;
      outline:none;
      font-weight: 900;
    }
    input:focus{
      border-color: rgba(24,36,89,.45);
      box-shadow: 0 0 0 4px rgba(24,36,89,.12);
    }

    .btn{
      width:100%;
      height: 48px;
      border-radius: 14px;
      border:1px solid var(--line);
      background:#fff;
      font-weight:1000;
      cursor:pointer;
    }
    .btn:hover{ filter:brightness(.99); }

    /* ✅ 이메일 버튼 색상 유지 */
    .btnPrimary{
      background: linear-gradient(135deg, var(--brand), var(--brand2));
      color:#fff;
      border-color: transparent;
      box-shadow: 0 14px 30px rgba(24,36,89,.18);
    }
    .btnRow{ display:grid; gap:10px; margin-top: 12px; }

    .socialStack{
      display:grid;
      gap:10px;
      margin-top: 14px;
      padding: 14px;
      border-radius: 16px;
      border:1px solid var(--line);
      background:#fff;
    }

    /* ✅ 사진처럼 "로고 + 텍스트" 구조 */
    .sbtn{
      height: 46px;
      border-radius: 10px;
      border:1px solid transparent;
      font-weight:1000;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      position:relative;
      padding-left:52px; /* 왼쪽 로고 영역 확보 */
    }
    .sicon{
      position:absolute;
      left:14px;
      width:26px;
      height:26px;
      border-radius:8px;
      display:grid;
      place-items:center;
      font-weight:1100;
      line-height:1;
      background: rgba(255,255,255,.20);
    }

    .naver{ background: var(--naver); color:#fff; }
    .kakao{ background: var(--kakao); color:#111; }
    .google{ background: var(--google); color:#fff; }
    .sbtn:disabled{ background:#e5e7eb; color:#9ca3af; cursor:not-allowed; }
    .sbtn:disabled .sicon{ background:rgba(0,0,0,.06); color:#9ca3af; }

    .divider{
      display:flex;
      align-items:center;
      gap:10px;
      color:var(--muted);
      font-size: 12px;
      margin: 14px 0 10px;
    }
    .divider::before, .divider::after{
      content:"";
      height:1px;
      flex:1;
      background: var(--line);
    }

    .err{
      display:none;
      margin-top:12px;
      padding: 10px 12px;
      border-radius: 12px;
      border:1px solid rgba(239,68,68,.20);
      background: rgba(239,68,68,.08);
      color: #7f1d1d;
      font-weight: 900;
      white-space: pre-wrap;
      line-height: 1.45;
    }
  </style>

  <script defer src="./login.js"></script>
</head>

<body>
  <div class="wrap">
    <div class="shell">

      <!-- Left -->
      <div class="leftCard">
        <div class="leftInner">
          <div class="appBadge">
            <div class="badgeContent">
              <div class="logo"><img src="./ts-logo.png" alt="TS Logo" /></div>
              <div style="font-weight:1000; font-size:17px;">TS (Tax Secretary)</div>
              <div style="font-size:12px; color:var(--muted);">세무 코치 SaaS</div>
            </div>
          </div>
          <div class="leftTitle">회원 로그인</div>
          <div class="leftSub">로그인하면 계산 결과를 저장하고 기록을 관리할 수 있어요.</div>
        </div>
      </div>

      <!-- Right -->
      <div class="card">
        <p class="title">로그인</p>

        <form id="loginForm" onsubmit="return false;" action="javascript:void(0)" novalidate>
          <label>이메일</label>
          <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />

          <label>비밀번호</label>
          <input id="password" type="password" placeholder="비밀번호" autocomplete="current-password" />

          <!-- API Base URL hidden -->
          <input id="apiBase" type="hidden" value="" />

          <div class="btnRow">
            <button id="btnLogin" class="btn btnPrimary" type="button">이메일로 로그인</button>
          </div>

          <div class="divider">또는</div>

          <div class="socialStack">
            <!-- ✅ 네이버 로고(N) -->
            <button class="sbtn naver" type="button" id="btnNaver">
              <span class="sicon" aria-hidden="true">N</span>
              네이버 간편 로그인
            </button>

            <!-- ✅ 카카오 로고(말풍선 느낌) - 클라이언트 ID 미설정으로 준비 중 -->
            <button class="sbtn kakao" type="button" id="btnKakao" disabled title="카카오 로그인 준비 중입니다">
              <span class="sicon" aria-hidden="true">💬</span>
              카카오톡 간편 로그인 (준비 중)
            </button>

            <!-- ✅ 구글 로고(G) -->
            <button class="sbtn google" type="button" id="btnGoogle">
              <span class="sicon" aria-hidden="true">G</span>
              구글 간편 로그인
            </button>

            <div class="divider" style="margin:12px 0 6px;">또는</div>

            <!-- ✅ 회원가입 버튼 색상 = 이메일 로그인 버튼과 동일 유지 -->
            <button class="btn btnPrimary" type="button" id="btnGoRegister">이메일로 회원가입하기</button>
          </div>

          <div class="err" id="errBox"></div>
        </form>

      </div>

    </div>
  </div>
</body>
</html>
