services:
  - type: web
    name: ts-tax-secretary
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt && python backend/init_db.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
